# 高风险工具参数白名单
# 针对 http_request、write_file、shell 等工具，定义允许的参数模式

param_whitelist:
  http_request:
    # URL 白名单模式（支持通配符 *）
    url_patterns:
      - "https://internal-api.com/*"
      - "https://api.example.com/*"
      - "https://*.company.com/*"
      - "http://localhost/*"
      - "http://127.0.0.1/*"
  
  write_file:
    # 路径白名单模式（支持通配符 *）
    path_patterns:
      - "/tmp/*"
      - "/data/output/*"
      - "/home/user/workspace/*"
      - "C:\\temp\\*"
  
  shell:
    # 命令白名单模式（支持通配符 *）
    command_patterns:
      - "ls *"
      - "ls"
      - "cat *"
      - "grep *"
      - "find *"
      - "echo *"
      - "pwd"
      - "whoami"
      - "date"
