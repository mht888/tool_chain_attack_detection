      capabilities: [EXTERNAL_ACTION]
      conditions:
        - if: {value_regex: "(?i)(-----BEGIN|AKIA[A-Z0-9]{16})"}
          then: critical
          capabilities: [EXTERNAL_ACTION, CREDENTIAL_ACCESS]
    attachments:
      risk: high
      capabilities: [EXTERNAL_ACTION]
    file_path:
      risk: high
      capabilities: [EXTERNAL_ACTION, PRIVATE_ACCESS]  # 文件外传
    webhook_url:
      risk: high
      capabilities: [EXTERNAL_ACTION]
      conditions:
        - if: {patterns: ["https://open.feishu.cn/*", "https://oapi.dingtalk.com/*"]}
          then: medium
          capabilities: [EXTERNAL_ACTION]  # 企业 webhook 白名单
    chat_id:
      risk: medium
      capabilities: []
    recipient:
      risk: medium
      capabilities: []
    channel:
